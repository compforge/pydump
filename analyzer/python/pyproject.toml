[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pydump-analyzer"
version = "0.1.0"
description = "Headless offline analyzer for Pydump heap artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "CompForge" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Debuggers",
]

[project.scripts]
pydump_analyzer = "pydump_analyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pydump_analyzer"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "NOTICE"]
