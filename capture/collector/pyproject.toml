[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pydump"
version = "0.1.0"
description = "Low-target-memory heap dumper for live CPython processes"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "CompForge" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Debuggers",
]

[project.scripts]
pydump = "pydump.cli:main"
pyheap_dump = "pydump.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pydump"]
artifacts = ["src/pydump/loader/bin/pydump-injector-*"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "benchmarks", "README.md", "LICENSE", "NOTICE"]
