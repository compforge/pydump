[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pydump"
version = "0.1.0"
description = "Low-target-memory heap dumper for live CPython processes"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "CompForge" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Debuggers",
]

[project.scripts]
pydump = "pydump.cli:main"
pyheap_dump = "pydump.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pydump"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "native", "README.md", "LICENSE", "NOTICE", "Makefile"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pydump"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
